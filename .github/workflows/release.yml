name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Android SDK 34
        run: |
          set -eu
          if [ ! -d "${ANDROID_HOME}/platforms/android-34" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.FILET_APK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FILET_APK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FILET_APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FILET_APK_KEY_PASSWORD }}
          REF: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          cd android
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/filet.keystore"
            export FILET_APK_KEYSTORE="$RUNNER_TEMP/filet.keystore"
            export FILET_APK_STORE_PASSWORD="$STORE_PASSWORD"
            export FILET_APK_KEY_ALIAS="$KEY_ALIAS"
            export FILET_APK_KEY_PASSWORD="$KEY_PASSWORD"
            gradle --no-daemon "-PfiletVersion=$REF" :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/filet-android.apk"
          else
            echo "::notice::未配置 FILET_APK_KEYSTORE_B64，本次 Release 挂的是 debug 签名包"
            gradle --no-daemon "-PfiletVersion=$REF" :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/filet-android.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: filet-android
          path: filet-android.apk
          if-no-files-found: error

  release:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: filet-android
          path: out

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: VERSION="${{ steps.v.outputs.version }}" sh scripts/build.sh

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p out
          for f in dist/filet-*; do
            base=$(basename "$f")
            case "$base" in
              *.exe)
                zip -q -j "out/filet-${VERSION}-windows-amd64.zip" "$f"
                ;;
              *)
                osarch=${base#filet-}
                tar -czf "out/filet-${VERSION}-${osarch}.tar.gz" -C dist "$base"
                ;;
            esac
          done
          (cd out && sha256sum filet-* > SHA256SUMS)
          ls -lh out

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p notes
          awk -v ver="## $VERSION" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## / { grab = 0 }
            grab { print }
          ' CHANGELOG.md > notes/RELEASE_NOTES.md
          if [ ! -s notes/RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md 缺少 $VERSION 小节，无法生成 Release 说明" >&2
            exit 1
          fi
          cat notes/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: filet ${{ steps.v.outputs.version }}
          body_path: notes/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: out/*
