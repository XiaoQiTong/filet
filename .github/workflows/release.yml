name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: VERSION="${{ steps.v.outputs.version }}" sh scripts/build.sh

      - name: Package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p out
          for f in dist/filet-*; do
            base=$(basename "$f")
            case "$base" in
              *.exe)
                zip -q -j "out/filet-${VERSION}-windows-amd64.zip" "$f"
                ;;
              *)
                osarch=${base#filet-}
                tar -czf "out/filet-${VERSION}-${osarch}.tar.gz" -C dist "$base"
                ;;
            esac
          done
          (cd out && sha256sum filet-* > SHA256SUMS)
          ls -lh out

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu
          mkdir -p notes
          awk -v ver="## $VERSION" '
            index($0, ver) == 1 { grab = 1; next }
            grab && /^## / { grab = 0 }
            grab { print }
          ' CHANGELOG.md > notes/RELEASE_NOTES.md
          if [ ! -s notes/RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md 缺少 $VERSION 小节，无法生成 Release 说明" >&2
            exit 1
          fi
          cat notes/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.version }}
          name: filet ${{ steps.v.outputs.version }}
          body_path: notes/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: out/*
