name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (host)
        run: go build ./...

      - name: Cross build
        run: VERSION=ci sh scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: filet-ci-${{ github.sha }}
          path: dist/
          retention-days: 7
