<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f7fb">
  <title>filet · 点对点文件直发</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="auth" class="auth">
    <div class="card">
      <h1>filet</h1>
      <p class="sub">账号登录 · 设备管理 · 点对点直发</p>
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">登录</button>
        <button id="tabRegister" class="tab" type="button">注册</button>
      </div>
      <form id="authForm">
        <label>用户名<input id="username" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
        <button id="authSubmit" type="submit">登录</button>
        <p id="authError" class="error"></p>
      </form>
      <p id="serverLine" class="serverline" hidden>服务器 <span id="serverHost"></span> <button id="serverEdit" class="link" type="button">更改</button></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header>
      <div class="brand">filet<span>P2P 直发</span></div>
      <div class="who"><button id="connStatus" class="conn" type="button" hidden></button><span id="whoami"></span><button id="logout" class="ghost" type="button">退出</button></div>
    </header>
    <main>
      <section class="panel">
        <div class="panel-head">
          <h2>我的设备</h2>
          <button id="refresh" class="ghost" type="button">刷新</button>
        </div>
        <p class="hint">只有在线设备能接收：目标设备需要运行 <code>filet agent</code>，或打开了 filet 网页（页面默认接收）。发给网页时对方需要先点击「接收」。本页面 30 分钟无操作会自动休眠并断开，点右上角「已休眠」或任意操作即可唤醒。</p>
        <ul id="devices" class="devices"></ul>
      </section>

      <section class="panel">
        <h2>发送文件</h2>
        <div id="drop" class="drop">
          <p><span id="fileLabel">拖入文件，或选择</span> <button id="pick" class="link" type="button">选择文件</button></p>
          <input id="fileInput" type="file" hidden>
        </div>
        <div class="actions">
          <button id="send" type="button" disabled>发送给选中设备</button>
          <button id="selectOnline" class="ghost" type="button">全选在线</button>
        </div>
        <p class="hint">文件在浏览器与目标设备之间通过 WebRTC 直连传输，不经过服务器。</p>
        <ul id="transfers" class="transfers"></ul>
      </section>
    </main>

    <section id="recvPanel" class="panel recv">
      <div class="panel-head">
        <h2>接收文件</h2>
        <button id="pickDir" class="ghost" type="button" hidden>选择保存目录</button>
      </div>
      <p class="hint" id="recvStatus"></p>
      <ul id="recvList" class="transfers"></ul>
    </section>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
